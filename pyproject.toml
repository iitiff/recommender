[project]
name = "recsys"
version = "0.1.0"
description = "A small, swappable recommender engine: catalog, events, models, and offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
recsys = "recsys.cli:app"

[project.optional-dependencies]
datasets = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pandas>=2.2",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
